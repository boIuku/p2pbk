syntax = "proto3";

package p2pbk.wire.v1;

option go_package = "p2pbk/internal/network/wire/pb;pb";

message Request {
  string method = 1;
  bytes payload = 2;
}

message Response {
  bool ok = 1;
  bytes payload = 2;
  string error = 3;
}

message ShardRef {
  string owner = 1;
  string blob_id = 2;
  int32 index = 3;
}

message PutShardRequest {
  ShardRef ref = 1;
  bytes data = 2;
  string hash = 3;
}

message GetShardRequest {
  ShardRef ref = 1;
}

message GetShardResponse {
  ShardRef ref = 1;
  bytes data = 2;
  string hash = 3;
}

message DeleteShardRequest {
  ShardRef ref = 1;
}

message DeleteShardResponse {
  bool deleted = 1;
}
